# =========================================
# 构建系统（Build backend）
# =========================================
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

# =========================================
# 项目信息（PEP 621）
# =========================================
[project]
name = "safe-game-flow"              # 替换为你的包名（PyPI 全局唯一）
dynamic = ["version"]

description = "safe game flow"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Your Name", email = "you@example.com" }
]
# maintainers = [{ name = "Maintainer Name", email = "maintainer@example.com" }]

keywords = ["template", "python", "package"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]

# 运行时依赖（安装时一并安装）
dependencies = [
  "numpy>=1.20",
  "torch>=1.9",
  "matplotlib>=3.3",
  "pillow>=8.0",  # for animation saving
]

# 可选依赖（pip install your-package-name[dev]）
[project.optional-dependencies]
dev = [
  "black>=24.0",
  "ruff>=0.6.0",
  "mypy>=1.10",
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ipython>=8.0",
  "pre-commit>=3.0",
]
docs = [
  "mkdocs>=1.5",
  "mkdocs-material>=9.0",
]

# 控制台脚本入口（安装后可直接运行 `your-cli`）
[project.scripts]
Mtrain = "safe_game_flow.flow_matching.train:main"
Mvisualize = "safe_game_flow.utils.visualize:main"

[project.urls]
#Homepage = "https://github.com/your/repo"
Repository = "https://gitee.com/karlmaji/safe-game-flow.git"
#Issues = "https://github.com/your/repo/issues"
#Documentation = "https://your-docs-site.example.com"

# =========================================
# Hatchling 构建配置
# 建议使用 src 布局：源码放在 src/your_package/
# =========================================
[tool.hatch.version]
# 若使用动态版本（上方 dynamic=["version"]），在此指定版本来源
# 需在 src/your_package/__init__.py 中定义 __version__ = "0.1.0"
path = "src/safe_game_flow/__init__.py"

[tool.hatch.build]
# 构建时包含/排除的文件（sdist/wheel 通用）
include = [
  "src/**",
  "pyproject.toml",
  "README.md",
  "LICENSE",
]
exclude = [
  "tests/**",
  "*.ipynb",
  ".github/**",
  ".vscode/**",
]

[tool.hatch.build.targets.wheel]
# 指定要打包的包路径（src 布局）
packages = ["src/safe_game_flow"]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "README.md",
  "LICENSE",
]

# 如果你的包是 typed（包含 py.typed），只需将 py.typed 放入 src/your_package/ 即可，
# Hatchling 会按上述 include 规则打包进去。

# =========================================
# 代码风格与静态检查
# =========================================
[tool.black]
line-length = 100
target-version = ["py310"]
exclude = '''
/(
  \.git
| \.venv
| build
| dist
| __pycache__
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
# 选择常见规则：E,F 基础错误；I 导入；UP 升级建议；B bugbear；SIM 简化；C4 comprehensions；N 命名
lint.select = ["E", "F", "I", "UP", "B", "SIM", "C4", "N"]
lint.ignore = [
  # 在此添加临时忽略的规则，如："E501"
  "N812",  # 允许 import torch.nn.functional as F (PyTorch 惯例)
  "N806",  # 允许大写变量名如 B, C, H (数学符号惯例)
  "N803",  # 允许大写参数名如 H (数学符号惯例)
]
# 如果想用 ruff 自带 formatter，可在 CI 或本地使用 `ruff format`（与 black 二选一）
# format.preview = true

# 若你只用 ruff 管理 import 顺序，可不再单独配置 isort。
# 如仍想使用 isort（与 black 对齐）：
[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src", "tests"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true
pretty = true
# 若使用 numpy 的 mypy 插件，可启用：
# plugins = ["numpy.typing.mypy_plugin"]

# =========================================
# 测试与覆盖率
# =========================================
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["safe_game_flow"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "if __name__ == .__main__.:",
  "pragma: no cover",
  "raise NotImplementedError",
]

# =========================================
# 可选：pre-commit（在 .pre-commit-config.yaml 中配置 hooks）
# =========================================
#